name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The suite is green on main. That is the point of this repository:
      # a green suite is not evidence that the bug is fixed.
      - name: npm test
        run: npm test
